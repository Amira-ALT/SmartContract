<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Billetterie Blockchain NFT 🎟️</title>
    <!-- On charge la bibliothèque Ethers.js pour parler à la blockchain -->
    <script src="https://cloudflare.com"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      button {
        background-color: #4caf50;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin: 10px 0;
        font-size: 16px;
        font-weight: bold;
        width: 100%;
      }
      button:disabled {
        background-color: #858585;
        cursor: not-allowed;
      }
      .box {
        padding: 15px;
        background-color: #f9f9f9;
        border-left: 5px solid #2196f3;
        margin: 15px 0;
        border-radius: 4px;
      }
      #statusTxt {
        font-weight: bold;
        margin-top: 15px;
        padding: 10px;
        border-radius: 4px;
        display: none;
      }
      .success {
        background-color: #d4edda;
        color: #155724;
        display: block !important;
      }
      .info {
        background-color: #e2e3e5;
        color: #383d41;
        display: block !important;
      }
      .error {
        background-color: #f8d7da;
        color: #721c24;
        display: block !important;
      }
    </style>
  </head>
  <body>
    <h2>🎟️ Ma Billetterie NFT Sécurisée</h2>

    <button id="connectBtn">1. Connecter MetaMask</button>
    <p id="walletAddress" style="word-break: break-all; color: #555">
      Portefeuille non connecté
    </p>

    <div class="box">
      <h3>Statut du Ticket #1</h3>
      <p>
        <strong>Propriétaire actuel :</strong><br /><span
          id="ticketOwner"
          style="font-family: monospace; color: #333"
          >Chargement...</span
        >
      </p>
      <p>
        <strong>Prix de revente sur le marché :</strong>
        <span style="color: #e91e63; font-weight: bold">0.011 ETH</span>
      </p>
    </div>

    <button id="buyBtn" disabled>
      2. Acheter le Ticket (Simuler l'Acheteur)
    </button>
    <div id="statusTxt"></div>

    <script>
      // Les adresses de TES contrats déployés (issues de ton historique)
      const TICKET_ADDRESS = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512";
      const MARKET_ADDRESS = "0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9";

      // Les fonctions (ABI) dont notre site a besoin pour interagir avec la blockchain
      const ticketAbi = [
        "function ownerOf(uint256 tokenId) view returns (address)",
      ];
      const marketAbi = ["function buy(uint256 tokenId) external payable"];

      let provider, signer, ticketContract, marketContract;

      // Action 1 : Connexion au portefeuille MetaMask
      document
        .getElementById("connectBtn")
        .addEventListener("click", async () => {
          if (typeof window.ethereum !== "undefined") {
            try {
              // Demande à MetaMask de se connecter au site
              await window.ethereum.request({ method: "eth_requestAccounts" });

              // Configuration d'Ethers.js avec MetaMask
              provider = new ethers.BrowserProvider(window.ethereum);
              signer = await provider.getSigner();
              const userAddress = await signer.getAddress();

              document.getElementById("walletAddress").innerText =
                "Connecté avec : " + userAddress;
              document.getElementById("buyBtn").disabled = false;

              // Initialisation des contrats pour le code JavaScript
              ticketContract = new ethers.Contract(
                TICKET_ADDRESS,
                ticketAbi,
                provider,
              );
              marketContract = new ethers.Contract(
                MARKET_ADDRESS,
                marketAbi,
                signer,
              );

              // Charger les infos du ticket depuis la blockchain locale
              updateTicketInfo();
            } catch (error) {
              console.error(error);
              showStatus(
                "Connexion refusée ou erreur de configuration.",
                "error",
              );
            }
          } else {
            showStatus(
              "Veuillez installer ou activer l'extension MetaMask !",
              "error",
            );
          }
        });

      // Fonction pour lire la blockchain et afficher le propriétaire actuel du NFT
      async function updateTicketInfo() {
        try {
          const owner = await ticketContract.ownerOf(1);
          document.getElementById("ticketOwner").innerText = owner;
        } catch (err) {
          document.getElementById("ticketOwner").innerText =
            "Erreur ou ticket non créé";
        }
      }

      // Action 2 : Lancer l'achat du billet
      document.getElementById("buyBtn").addEventListener("click", async () => {
        showStatus(
          "Transaction en cours... En attente de ta confirmation dans MetaMask.",
          "info",
        );
        try {
          // Appel de la fonction buy() du TicketMarket en envoyant la valeur exacte de 0.011 ETH
          const tx = await marketContract.buy(1, {
            value: ethers.parseEther("0.011"),
          });

          // On attend que la transaction soit validée par la blockchain Hardhat
          await tx.wait();

          showStatus(
            "Succès ! Le ticket a été acheté 🎉 La répartition automatique des fonds a été effectuée.",
            "success",
          );
          updateTicketInfo(); // On met à jour le propriétaire affiché à l'écran
        } catch (error) {
          console.error(error);
          showStatus(
            "Erreur lors de l'achat. Vérifie que tu es bien connecté sur le compte 'Acheteur' et non 'Organisateur' !",
            "error",
          );
        }
      });

      function showStatus(text, type) {
        const statusEl = document.getElementById("statusTxt");
        statusEl.innerText = text;
        statusEl.className = type;
      }
    </script>
  </body>
</html>
